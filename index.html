<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Blue Direction Arrow Indicator (Real Mouse Trajectory) -->
    <svg id="direction-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
    </svg>

    <!-- White Arrow Indicator (Points to Nearest Collectible Dot) -->
    <svg id="nearest-dot-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
    </svg>

    <!-- Custom Game Cursor -->
    <div id="custom-cursor"></div>

    <!-- Viewport / Camera Window -->
    <div id="game-container">
        <!-- Live World Coordinates & Score HUD -->
        <div id="coords-hud">
            <span id="pos-text">X: 0 | Y: 0</span>
            <span id="score-text">Dots: 0 / 50</span>
        </div>

        <!-- Ability Cooldown HUD Bar -->
        <div id="ability-hud">
            <span class="key-badge">SPACE</span>
            <span class="ability-name">Flash Step</span>
            <span id="ability-status" class="ready">[READY]</span>
        </div>

        <!-- Enemy Selection Modal (Also locks pointer on click) -->
        <div id="enemy-select-modal">
            <h2>CHOOSE YOUR ENEMY</h2>
            <p>Click an enemy card to begin and lock mouse pointer</p>
            <div class="enemy-cards">
                <div class="card" onclick="selectEnemy(1)">
                    <div class="card-icon shadow-icon"></div>
                    <h3>1. The Shadow</h3>
                    <p>Follows your exact movement trail. Stopping or retracing your steps means instant death!</p>
                </div>
