<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Direction Arrow Indicator (Targeting Trajectory) -->
    <svg id="direction-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
    </svg>

    <!-- Custom Game Cursor -->
    <div id="custom-cursor"></div>

    <!-- Viewport / Camera Window -->
    <div id="game-container">
        <!-- Live World Coordinates HUD -->
        <div id="coords-hud">X: 0 | Y: 0</div>

        <!-- Overlay Prompt for Pointer Lock -->
        <div id="lock-hint">Click anywhere to lock pointer inside game (ESC to unlock)</div>

        <!-- Infinite Explorable Map Background -->
        <div id="map">
            <!-- Center Landmark at World (0,0) -->
            <div id="center-marker">+ WORLD CENTER (0, 0)</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
